# SLOP-LORD Runtime Configuration
# All addresses, ports, and tuning parameters live here.
# Environment variables with matching names override these values at startup.
# Never hardcode addresses in source files — always read from this config.

browser:
  cdpPort: 9222
  cdpHost: "localhost"
  # Persistent Chrome profile — session cookies survive restarts
  profileDir: "~/.slop-lord/chrome-profile"
  # How long to wait for Chrome CDP to become available (seconds)
  cdpReadyTimeoutSec: 30
  # How long to idle when the human grabs the mouse (seconds)
  humanIdleSec: 5

# ─────────────────────────────────────────────────────────────────────────────
# LLM Inference Backends
#
# Three named roles — point each at any OpenAI-compatible endpoint:
#
#   text   — reasoning/generation (brief writing, scoring, LLM picker)
#            Must return the answer in choices[0].message.content OR
#            reasoning_content (handled automatically).
#
#   vision — multimodal (thumbnail description, brief image context)
#            Must accept image_url in the user message content array.
#            Set enable_thinking: false if the model supports it.
#
#   verify — edit verification (Qwen-edit pass/fail judge)
#            Must accept two image_url inputs in one message.
#            Can be the same endpoint as vision.
#
# To swap a backend: change baseUrl + model here, nothing else.
# Env var overrides (all optional):
#   INFERENCE_TEXT_URL       INFERENCE_TEXT_MODEL
#   INFERENCE_VISION_URL     INFERENCE_VISION_MODEL
#   INFERENCE_VERIFY_URL     INFERENCE_VERIFY_MODEL
# ─────────────────────────────────────────────────────────────────────────────
inference:
  text:
    baseUrl: "http://10.0.1.8:1234/v1"
    model:   "qwen3.8-27b"
    isReasoningModel: true
    temperatureCreative:      0.8   # brief generation, picker
    temperatureDeterministic: 0.1   # classification, scoring

  vision:
    baseUrl: "http://10.0.1.8:1234/v1"
    model:   "qwen3.8-27b"
    # LM Studio reasoning model — answer comes in reasoning_content when content is empty
    isReasoningModel: true

  verify:
    baseUrl: "http://10.0.1.8:1234/v1"
    model:   "qwen3.8-27b"
    isReasoningModel: true
    # Max Qwen-edit retry passes before accepting the last result as-is
    maxPasses: 3

# Legacy aliases — kept so existing code doesn't break during migration.
# These will be removed once all callers use inference.* directly.
lmStudio:
  baseUrl: "http://10.0.1.8:1234/v1"
  model: "qwen3.8-27b"
  temperatureCreative: 0.8
  temperatureDeterministic: 0.1

sglang:
  baseUrl: "http://10.0.1.3:8888/v1"
  model: "qwen3.8-27b-sglang"
  verifyMaxPasses: 3

comfyui:
  host: "10.0.1.99"
  port: 8188
  # Named style presets — these must match workflow names in your ComfyUI instance.
  # Add / remove presets here; the web UI Style Studio dropdown reads this list.
  stylePresets:
    - name: "default"
      description: "Balanced general-purpose style"
    - name: "anime"
      description: "Flat cel-shaded anime aesthetic"
    - name: "grunge"
      description: "Distressed lo-fi texture"
    - name: "corporate"
      description: "Clean stock-photo realism (for irony)"

database:
  host: "localhost"
  port: 5432
  name: "slop_lord"
  user: "slop"
  # password is read from DB_PASSWORD env var only — never written here
  poolMin: 2
  poolMax: 10

searxng:
  url: "http://localhost:8080"
  timeoutMs: 10000

firecrawl:
  url: "http://localhost:3002"
  apiKey: "local"
  timeoutMs: 30000

# Stagehand LLM — used only for browser DOM reasoning (act / extract)
# This is SEPARATE from the LM Studio model used by the Parody Engine.
# Stagehand requires an OpenAI or Anthropic API key.
# Override via OPENAI_API_KEY or ANTHROPIC_API_KEY environment variables.
# Override model via STAGEHAND_MODEL (must be an AvailableModel value).
stagehand:
  model: "gpt-4o-mini"   # cheapest model that works reliably for DOM tasks

scanner:
  intervalMinutes: 60
  tssThreshold: 0.65
  dedupWindowHours: 48
  # Max candidates to evaluate per scan run before stopping
  maxCandidatesPerRun: 50

qwen:
  # Qwen-Image-Edit via ComfyUI on the LAN DGX Spark (10.0.1.3:8188).
  # These are the actual filenames present on that instance (confirmed via /object_info).
  unetName:  "qwen_image_edit_2511_bf16.safetensors"
  clipName:  "qwen_2.5_vl_7b_fp8_scaled.safetensors"
  vaeName:   "qwen_image_vae.safetensors"
  # Lightning 4-step LoRA for fast generation
  loraName:  "Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors"
  enableTurbo: true      # uses the Lightning LoRA (4 steps instead of 20)
  steps: 20              # ignored when turbo=true
  seed: -1               # -1 = random each run
  # Where to save edited frames locally (fetched back from ComfyUI /view)
  outputDir: "./edited-frames"

minimax:
  # MiniMax H3 I2V via ComfyUI on 10.0.1.99:8188
  # No API key required — local inference only.
  # Confirmed present via /object_info on 2026-09-29.

  # Standard model — nvfp4 quantization (lower VRAM than fp16, same quality)
  unetName:     "minimax_h3_fl2va_pruned_nvfp4_convrot_int8.safetensors"
  clipName:     "text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors"
  # int8 VAE — faster decode, lower VRAM than fp16
  vaeName:      "minimax_h3_video_vae_int8_convrot.safetensors"
  audioVaeName: "minimax_h3_audio_vae_fp32.safetensors"

  # Turbo (fastvideo) — 4-step flow distillation model, ~5x faster than standard
  # Set enableTurbo: true to use this instead of the standard model.
  turboUnetName: "minimax_h3_fastvideo_vsa_datafree_1300step_4step_int8_convrot.safetensors"
  enableTurbo:  false        # true = use turboUnetName at turboSteps
  turboSteps:   4            # fastvideo is distilled for exactly 4 steps
  turboStrength: 1.0

  # Sampling — res_multistep + BasicGuider (no CFG, no negative prompt)
  steps:        20           # ignored when enableTurbo: true
  loraName:     ""

  width:        768          # 768×1344 = 9:16 portrait for TikTok
  height:       1344
  duration:     5            # seconds → 125 frames at 24fps on 17k+5 grid
  pollIntervalMs: 5000       # poll /history every 5s
  pollTimeoutMs:  3600000    # max wait 1 hour — first run loads ~35 GB of weights
  outputDir: "./generated"

web:
  port: 3030
  host: "0.0.0.0"

downloads:
  # Where transcoded videos are saved on the local machine.
  # Each video is stored as <videoId>.mp4 at 480p.
  # Override via DOWNLOADS_DIR env var.
  dir: "./downloads"

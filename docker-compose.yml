# docker-compose.yml
#
# All services for SLOP-LORD.
# Start with: docker compose up -d
#
# Environment:
#   DB_PASSWORD  — required; set in .env
#   OPENAI_API_KEY or ANTHROPIC_API_KEY — required for Stagehand (set in .env)
#
# Ports exposed on the host:
#   5432  — Postgres
#   8080  — SearXNG
#   3002  — Firecrawl API
#   3000  — Firecrawl Playwright renderer
#   3030  — SLOP-LORD web UI (LAN-accessible)

services:

  # ---------------------------------------------------------------------------
  # Postgres 16 — primary data store
  # Migrations in ./db/migrations/ run automatically on first start.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB:       slop_lord
      POSTGRES_USER:     slop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d   # runs on first start only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slop -d slop_lord"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # SearXNG — privacy-preserving meta-search (hashtag/topic discovery)
  # Config: ./config/searxng/settings.yml
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config/searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Firecrawl — structured page scraping + crawl
  # Includes a bundled Playwright renderer service for JS-heavy pages.
  # ---------------------------------------------------------------------------
  firecrawl-playwright:
    image: ghcr.io/mendableai/firecrawl-playwright-service:latest
    restart: unless-stopped
    ports:
      - "3000:3000"

  firecrawl:
    image: ghcr.io/mendableai/firecrawl:latest
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - FIRECRAWL_API_KEY=local
      - PLAYWRIGHT_MICROSERVICE_URL=http://firecrawl-playwright:3000
    depends_on:
      - firecrawl-playwright

  # ---------------------------------------------------------------------------
  # SLOP-LORD web UI — Trend Dashboard + Style Studio + Job Queue
  # LAN-accessible at http://<host-ip>:3030
  # Built from ./web/Dockerfile
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "0.0.0.0:3030:3030"
    environment:
      DATABASE_URL: postgres://slop:${DB_PASSWORD}@postgres:5432/slop_lord
      RUNTIME_CONFIG_PATH: /config/runtime.yaml
    volumes:
      - ./config:/config     # exposes runtime.yaml to the settings editor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
